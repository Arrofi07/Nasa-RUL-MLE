[project]
name = "nasa-rul-mle"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cloudpickle==3.1.2",
    "fastapi==0.115.12",
    "lightgbm==4.6.0",
    "mlflow==3.11.1",
    "numpy==2.4.4",
    "pandas==2.3.3",
    "psutil==7.2.2",
    "pyarrow==23.0.1",
    "pydantic==2.11.4",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "torch==2.11.0",
    "tqdm==4.67.3",
    "uvicorn[standard]==0.34.3",
    "xgboost==3.2.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "mypy==1.15.0",
    "plotly>=5.22.0",
    "pre-commit==4.2.0",
    "pytest==8.3.5",
    "pytest-cov==6.1.0",
    "ruff==0.11.8",
    "streamlit>=1.35.0",
]
notebook = [
    "ipykernel==6.29.5",
    "jupyter==1.1.1",
    "matplotlib==3.10.3",
    "optuna==4.3.0",
    "optuna-dashboard==0.18.0",
    "seaborn==0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]