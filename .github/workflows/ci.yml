name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev
        # --frozen: fail if uv.lock is out of sync with pyproject.toml (catches drift)
        # --extra dev: installs pytest, ruff, httpx, etc. declared under [dev]

      - name: Ruff
        run: |
          if uv run python -c "import importlib.util; exit(0 if importlib.util.find_spec('ruff') else 1)"
          then
            uv run ruff check .
          else
            echo "ruff not installed, skipping."
          fi

      - name: Black
        run: |
          if uv run python -c "import importlib.util; exit(0 if importlib.util.find_spec('black') else 1)"
          then
            uv run black --check .
          else
            echo "black not installed, skipping."
          fi

      - name: Run tests
        env:
            PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest -v

      - name: Build Docker image
        run: |
          docker build -t nasa-rul-api .