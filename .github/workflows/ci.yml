name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    steps:

      ############################
      # Checkout repository
      ############################

      - name: Checkout repository
        uses: actions/checkout@v4

      ############################
      # Setup Python
      ############################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      ############################
      # Install uv
      ############################

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      ############################
      # Cache dependencies
      ############################

      - name: Enable uv cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}

      ############################
      # Install project
      ############################

      - name: Install dependencies
        run: |
          uv sync

      ############################
      # Ruff (skip if unavailable)
      ############################

      - name: Ruff
        run: |
          if uv run python -c "import importlib.util; exit(0 if importlib.util.find_spec('ruff') else 1)"
          then
            uv run ruff check .
          else
            echo "ruff not installed, skipping."
          fi

      ############################
      # Black (skip if unavailable)
      ############################

      - name: Black
        run: |
          if uv run python -c "import importlib.util; exit(0 if importlib.util.find_spec('black') else 1)"
          then
            uv run black --check .
          else
            echo "black not installed, skipping."
          fi

      ############################
      # Run tests
      ############################

      - name: Run pytest
        run: |
          uv run pytest -v

      ############################
      # Build Docker image
      ############################

      - name: Build Docker image
        run: |
          docker build -t nasa-rul-api .