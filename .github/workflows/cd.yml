name: Deploy to Railway

on:

  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  contents: read

jobs:

  deploy:

    if: >
      ${{github.event.workflow_run.conclusion == 'success'}}

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Railway Deployment
        run: |
          curl \
            -X POST \
            "${{ secrets.RAILWAY_DEPLOY_HOOK }}"